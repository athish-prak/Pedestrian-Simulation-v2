# 4. Damping
RESISTANCE_FORCE_COEFFICIENT_GAMMA: 0.2

# 5. Normalized State Switching
# "Under Pressure" if external forces > 40% of drive capability
FORCE_SWITCH_RATIO: 0.4

# 6. Density (Unused)
DENSITY_SPEED_PENALTY_ALPHA: 0.0